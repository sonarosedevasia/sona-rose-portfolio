<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad)" rx="12" />
  
  <!-- Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Editor Window Frame -->
  <rect x="40" y="30" width="520" height="300" rx="8" fill="#131b2e" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="30" width="520" height="36" rx="8" fill="#0d1322" />
  <circle cx="62" cy="48" r="5" fill="#ef4444" />
  <circle cx="78" cy="48" r="5" fill="#f59e0b" />
  <circle cx="94" cy="48" r="5" fill="#10b981" />
  <text x="120" y="52" fill="#94a3b8" font-family="monospace" font-size="11">neurosearch :: embedding_pipeline.py</text>
  <rect x="440" y="40" width="100" height="16" rx="4" fill="rgba(99, 102, 241, 0.2)" />
  <text x="450" y="52" fill="#818cf8" font-family="monospace" font-size="10">AST Vector: 768d</text>

  <!-- Code Area (Left) -->
  <g font-family="monospace" font-size="10" xml:space="preserve">
    <text x="65" y="95" fill="#ec4899">def</text>
    <text x="92" y="95" fill="#60a5fa">parse_ast_chunks</text>
    <text x="200" y="95" fill="#f8fafc">(source_file: str):</text>

    <text x="85" y="120" fill="#94a3b8">tree = parser.parse(source_code)</text>
    <text x="85" y="145" fill="#94a3b8">nodes = query_ast(tree, "(function_definition)")</text>
    
    <text x="85" y="170" fill="#ec4899">for</text>
    <text x="110" y="170" fill="#f8fafc">node</text>
    <text x="140" y="170" fill="#ec4899">in</text>
    <text x="160" y="170" fill="#f8fafc">nodes:</text>

    <text x="105" y="195" fill="#38bdf8">vector = model.encode(node.text)</text>
    <text x="105" y="220" fill="#34d399">chroma_collection.add(vector)</text>
  </g>

  <!-- Neural Vector Graph Graphic (Right) -->
  <rect x="330" y="85" width="210" height="225" rx="8" fill="#090e1a" stroke="rgba(99, 102, 241, 0.25)" />
  
  <text x="345" y="108" fill="#c7d2fe" font-family="sans-serif" font-weight="600" font-size="11">High-Dim Vector Space</text>
  <text x="345" y="124" fill="#64748b" font-family="monospace" font-size="9">Cosine Similarity: 0.962</text>

  <!-- Connecting Nodes / Graph -->
  <g stroke="rgba(99,102,241,0.4)" stroke-width="1.2">
    <line x1="370" y1="160" x2="430" y2="190" />
    <line x1="430" y1="190" x2="490" y2="160" />
    <line x1="430" y1="190" x2="440" y2="250" />
    <line x1="370" y1="160" x2="400" y2="240" />
    <line x1="440" y1="250" x2="500" y2="230" />
    <line x1="490" y1="160" x2="510" y2="200" />
  </g>

  <!-- Central Query Pulsing Node -->
  <circle cx="430" cy="190" r="14" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="430" cy="190" r="6" fill="#ffffff" />

  <!-- Surrounding Clusters -->
  <circle cx="370" cy="160" r="8" fill="#38bdf8" />
  <circle cx="490" cy="160" r="9" fill="#818cf8" />
  <circle cx="440" cy="250" r="8" fill="#34d399" />
  <circle cx="400" cy="240" r="6" fill="#a78bfa" />
  <circle cx="500" cy="230" r="7" fill="#38bdf8" />
  <circle cx="510" cy="200" r="5" fill="#f43f5e" />

  <!-- Latency badge -->
  <rect x="65" y="260" width="160" height="28" rx="6" fill="#1e293b" />
  <circle cx="80" cy="274" r="4" fill="#10b981" />
  <text x="92" y="278" fill="#f1f5f9" font-family="monospace" font-size="10">Match Latency: 38ms</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="nluBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#18132e" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#nluBg)" rx="12" />

  <!-- Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- App Window -->
  <rect x="35" y="25" width="530" height="310" rx="10" fill="#131226" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" />

  <!-- App Header -->
  <rect x="35" y="25" width="530" height="38" rx="10" fill="#0c0b1a" />
  <circle cx="58" cy="44" r="5" fill="#ef4444" />
  <circle cx="74" cy="44" r="5" fill="#f59e0b" />
  <circle cx="90" cy="44" r="5" fill="#10b981" />
  <text x="115" y="48" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Bot Trainer :: NLU Intent &amp; Entity Workbench</text>
  <rect x="420" y="34" width="130" height="20" rx="4" fill="rgba(139, 92, 246, 0.25)" />
  <text x="430" y="48" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">Streamlit &#8226; BERT &#8226; spaCy</text>

  <!-- Left Column: Dataset & Intent Annotation -->
  <rect x="52" y="78" width="230" height="240" rx="8" fill="#1b1735" stroke="rgba(255,255,255,0.06)" />
  <text x="66" y="102" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">🏷️ Intent &amp; Entity Annotator</text>

  <!-- Sample 1 -->
  <rect x="64" y="115" width="206" height="44" rx="6" fill="#110e24" />
  <text x="74" y="131" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9.5">"Book a flight to Paris"</text>
  <rect x="74" y="138" width="80" height="15" rx="3" fill="rgba(139,92,246,0.3)" />
  <text x="80" y="149" fill="#c4b5fd" font-family="sans-serif" font-size="8.5">intent: book_flight</text>
  <rect x="160" y="138" width="56" height="15" rx="3" fill="rgba(6,182,212,0.3)" />
  <text x="166" y="149" fill="#67e8f9" font-family="sans-serif" font-size="8.5">loc: Paris</text>

  <!-- Sample 2 -->
  <rect x="64" y="167" width="206" height="44" rx="6" fill="#110e24" />
  <text x="74" y="183" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="9.5">"Show savings account balance"</text>
  <rect x="74" y="190" width="88" height="15" rx="3" fill="rgba(139,92,246,0.3)" />
  <text x="80" y="201" fill="#c4b5fd" font-family="sans-serif" font-size="8.5">intent: check_balance</text>

  <!-- Active Learning Banner -->
  <rect x="64" y="222" width="206" height="84" rx="6" fill="#110e24" stroke="rgba(236,72,153,0.3)" />
  <text x="74" y="240" fill="#f472b6" font-family="sans-serif" font-size="10.5" font-weight="700">🔄 Active Learning Flag (3)</text>
  <text x="74" y="256" fill="#cbd5e1" font-family="sans-serif" font-size="9">Low confidence inference: 54%</text>
  <text x="74" y="271" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="9">"Transfer money quick"</text>
  <rect x="74" y="280" width="100" height="18" rx="3" fill="url(#purpleGrad)" />
  <text x="86" y="293" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">Validate &amp; Retrain</text>

  <!-- Right Column: Evaluation Dashboard -->
  <rect x="294" y="78" width="255" height="240" rx="8" fill="#1b1735" stroke="rgba(139, 92, 246, 0.2)" />
  <text x="310" y="102" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="700">📊 Multi-Model Performance</text>
  <text x="310" y="117" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Version comparison: Accuracy, Precision, F1</text>

  <!-- Table Header -->
  <rect x="306" y="128" width="231" height="22" rx="4" fill="#110e24" />
  <text x="314" y="143" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">MODEL</text>
  <text x="382" y="143" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">ACC</text>
  <text x="432" y="143" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">PREC</text>
  <text x="488" y="143" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">F1</text>

  <!-- Row 1: BERT -->
  <rect x="306" y="154" width="231" height="32" rx="4" fill="#16122d" />
  <text x="314" y="174" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">BERT</text>
  <text x="382" y="174" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">94.8%</text>
  <text x="432" y="174" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">93.2%</text>
  <text x="488" y="174" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">0.94</text>

  <!-- Row 2: spaCy -->
  <rect x="306" y="190" width="231" height="32" rx="4" fill="#16122d" />
  <text x="314" y="210" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">spaCy</text>
  <text x="382" y="210" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">91.4%</text>
  <text x="432" y="210" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">90.5%</text>
  <text x="488" y="210" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="9.5">0.91</text>

  <!-- Row 3: Logistic Regression -->
  <rect x="306" y="226" width="231" height="32" rx="4" fill="#16122d" />
  <text x="314" y="246" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9.5">LogReg</text>
  <text x="382" y="246" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">86.7%</text>
  <text x="432" y="246" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">85.4%</text>
  <text x="488" y="246" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="9.5">0.86</text>

  <!-- Mini Accuracy Bar -->
  <rect x="306" y="268" width="231" height="38" rx="4" fill="#110e24" />
  <text x="316" y="284" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Best Model: <tspan fill="#34d399" font-weight="700">BERT Fine-Tuned (+3.4% F1)</tspan></text>
  <text x="316" y="298" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">Confusion Matrix: 0.94 Diagonal Dominance</text>
</svg>

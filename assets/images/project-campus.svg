<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#0b111e" rx="12" />
  <rect x="30" y="25" width="540" height="310" rx="10" fill="#131c2e" stroke="rgba(255,255,255,0.08)" />
  <rect x="30" y="25" width="540" height="36" rx="10" fill="#0c1220" />
  <circle cx="50" cy="43" r="4.5" fill="#ef4444" />
  <circle cx="65" cy="43" r="4.5" fill="#f59e0b" />
  <circle cx="80" cy="43" r="4.5" fill="#10b981" />
  <text x="105" y="47" fill="#60a5fa" font-family="monospace" font-size="11">CampusConnect :: Peer Resource Exchange &amp; Study Pods</text>

  <g transform="translate(60, 80)">
    <!-- Resource Cards -->
    <rect x="0" y="0" width="210" height="100" rx="8" fill="#1e293b" />
    <text x="15" y="26" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="12">📘 CS301 Operating Systems</text>
    <text x="15" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">Verified Exam Notes • Prof. Review</text>
    <rect x="15" y="65" width="70" height="18" rx="4" fill="rgba(16,185,129,0.2)" />
    <text x="22" y="77" fill="#34d399" font-family="monospace" font-size="9">✔ 482 DLs</text>

    <rect x="0" y="115" width="210" height="100" rx="8" fill="#1e293b" />
    <text x="15" y="141" fill="#a78bfa" font-family="sans-serif" font-weight="600" font-size="12">💻 CS204 Algorithms Lab</text>
    <text x="15" y="163" fill="#94a3b8" font-family="sans-serif" font-size="10">Dynamic Programming Visuals</text>
    <rect x="15" y="180" width="70" height="18" rx="4" fill="rgba(99,102,241,0.2)" />
    <text x="22" y="192" fill="#818cf8" font-family="monospace" font-size="9">✔ 920 DLs</text>

    <!-- Right Side Study Pod Graph -->
    <rect x="235" y="0" width="245" height="215" rx="8" fill="#0c1322" stroke="rgba(255,255,255,0.06)" />
    <text x="250" y="28" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="12">Study Pod Matchmaker</text>
    
    <!-- Avatars in pod -->
    <circle cx="300" cy="100" r="24" fill="#3b82f6" />
    <text x="294" y="106" fill="#fff" font-family="sans-serif" font-weight="700" font-size="14">S</text>
    
    <circle cx="410" cy="80" r="20" fill="#10b981" />
    <text x="405" y="85" fill="#fff" font-family="sans-serif" font-weight="700" font-size="12">K</text>

    <circle cx="360" cy="160" r="22" fill="#8b5cf6" />
    <text x="354" y="166" fill="#fff" font-family="sans-serif" font-weight="700" font-size="12">R</text>

    <!-- Connectors -->
    <line x1="300" y1="100" x2="410" y2="80" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" />
    <line x1="410" y1="80" x2="360" y2="160" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" />
    <line x1="360" y1="160" x2="300" y2="100" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4" />
  </g>
</svg>

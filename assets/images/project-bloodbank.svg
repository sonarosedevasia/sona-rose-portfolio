<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bloodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0e" />
      <stop offset="100%" stop-color="#241017" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bloodBg)" rx="12" />

  <!-- Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- App Window -->
  <rect x="35" y="25" width="530" height="310" rx="10" fill="#1b0e14" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.5" />

  <!-- Header -->
  <rect x="35" y="25" width="530" height="38" rx="10" fill="#12080c" />
  <circle cx="58" cy="44" r="5" fill="#ef4444" />
  <circle cx="74" cy="44" r="5" fill="#f59e0b" />
  <circle cx="90" cy="44" r="5" fill="#10b981" />
  <text x="115" y="48" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Blood Bank Management System &#8226; Centralized Registry</text>
  <rect x="420" y="34" width="130" height="20" rx="4" fill="rgba(239, 68, 68, 0.25)" />
  <text x="432" y="48" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10">Flask + SQLite CRUD</text>

  <!-- Left: Multi-Field Donor Search & Filter -->
  <rect x="52" y="78" width="200" height="240" rx="8" fill="#24121a" stroke="rgba(255,255,255,0.06)" />
  <text x="66" y="102" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">🔍 Multi-Field Search</text>

  <!-- Search by Blood Group -->
  <text x="66" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Filter by Blood Group:</text>
  <g font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
    <rect x="66" y="133" width="38" height="24" rx="4" fill="url(#redGrad)" />
    <text x="76" y="149" fill="#ffffff">O+</text>

    <rect x="110" y="133" width="38" height="24" rx="4" fill="#150a0f" stroke="rgba(239,68,68,0.4)" />
    <text x="120" y="149" fill="#fca5a5">A+</text>

    <rect x="154" y="133" width="38" height="24" rx="4" fill="#150a0f" stroke="rgba(239,68,68,0.4)" />
    <text x="164" y="149" fill="#fca5a5">B+</text>

    <rect x="198" y="133" width="42" height="24" rx="4" fill="#150a0f" stroke="rgba(239,68,68,0.4)" />
    <text x="206" y="149" fill="#fca5a5">AB+</text>
  </g>

  <!-- Search Input: Name / ID -->
  <text x="66" y="178" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Search by Name or ID:</text>
  <rect x="66" y="186" width="172" height="28" rx="4" fill="#150a0f" stroke="rgba(255,255,255,0.1)" />
  <text x="76" y="204" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Kanjirappally | O+</text>

  <!-- Quick Add Donor CTA -->
  <rect x="66" y="230" width="172" height="32" rx="5" fill="url(#redGrad)" />
  <text x="100" y="250" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">+ Register New Donor</text>

  <rect x="66" y="272" width="172" height="32" rx="5" fill="#150a0f" stroke="rgba(255,255,255,0.1)" />
  <text x="88" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="10">Generate SQL Report</text>

  <!-- Right: Donor Registry Table -->
  <rect x="264" y="78" width="285" height="240" rx="8" fill="#24121a" stroke="rgba(239, 68, 68, 0.2)" />
  <text x="280" y="102" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">🩸 Active Donor Records (SQLite)</text>

  <!-- Table Header -->
  <rect x="276" y="118" width="261" height="22" rx="4" fill="#150a0f" />
  <text x="284" y="133" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">ID</text>
  <text x="320" y="133" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">DONOR NAME</text>
  <text x="428" y="133" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">GRP</text>
  <text x="475" y="133" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">CONTACT</text>

  <!-- Row 1 -->
  <rect x="276" y="144" width="261" height="36" rx="4" fill="#1a0b12" />
  <text x="284" y="166" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9">#104</text>
  <text x="320" y="166" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="600">Mathew Joseph</text>
  <rect x="426" y="152" width="28" height="20" rx="3" fill="rgba(239,68,68,0.25)" />
  <text x="432" y="166" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">O+</text>
  <text x="470" y="166" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">Verified ✓</text>

  <!-- Row 2 -->
  <rect x="276" y="184" width="261" height="36" rx="4" fill="#1a0b12" />
  <text x="284" y="206" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9">#105</text>
  <text x="320" y="206" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="600">Anjali Nair</text>
  <rect x="426" y="192" width="28" height="20" rx="3" fill="rgba(239,68,68,0.25)" />
  <text x="432" y="206" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">A+</text>
  <text x="470" y="206" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">Verified ✓</text>

  <!-- Row 3 -->
  <rect x="276" y="224" width="261" height="36" rx="4" fill="#1a0b12" />
  <text x="284" y="246" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9">#106</text>
  <text x="320" y="246" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="600">Rahul Krishna</text>
  <rect x="426" y="232" width="28" height="20" rx="3" fill="rgba(239,68,68,0.25)" />
  <text x="432" y="246" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">B+</text>
  <text x="470" y="246" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5">Verified ✓</text>

  <!-- Status Footer -->
  <rect x="276" y="268" width="261" height="38" rx="4" fill="#150a0f" />
  <text x="286" y="284" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">SQL Query: <tspan fill="#34d399" font-family="'JetBrains Mono', monospace">SELECT * FROM donors WHERE blood_group='O+'</tspan></text>
  <text x="286" y="298" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Execution: 0.8ms &#8226; Fast indexed multi-field lookup</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#cloudBg)" rx="12" />

  <!-- Window Frame -->
  <rect x="30" y="25" width="540" height="310" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="30" y="25" width="540" height="40" rx="10" fill="#0c1322" />
  <circle cx="55" cy="45" r="4.5" fill="#ef4444" />
  <circle cx="70" cy="45" r="4.5" fill="#f59e0b" />
  <circle cx="85" cy="45" r="4.5" fill="#10b981" />
  <text x="110" y="49" fill="#94a3b8" font-family="monospace" font-size="11">CloudPulse Core // Cluster telemetry live-stream</text>
  <rect x="445" y="34" width="105" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
  <circle cx="457" cy="45" r="3" fill="#10b981" />
  <text x="466" y="49" fill="#34d399" font-family="monospace" font-size="10">LIVE 15.2k msg/s</text>

  <!-- Left Stats Panel -->
  <g transform="translate(50, 85)">
    <!-- Node Health Card -->
    <rect x="0" y="0" width="140" height="65" rx="6" fill="#192238" stroke="rgba(255,255,255,0.05)" />
    <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Worker Pods</text>
    <text x="12" y="48" fill="#f8fafc" font-family="monospace" font-weight="700" font-size="20">64 / 64</text>

    <!-- p99 Latency Card -->
    <rect x="0" y="78" width="140" height="65" rx="6" fill="#192238" stroke="rgba(255,255,255,0.05)" />
    <text x="12" y="100" fill="#94a3b8" font-family="sans-serif" font-size="10">p99 Gateway Latency</text>
    <text x="12" y="126" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="20">41.8 ms</text>

    <!-- Memory Utilization -->
    <rect x="0" y="156" width="140" height="65" rx="6" fill="#192238" stroke="rgba(255,255,255,0.05)" />
    <text x="12" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Ring Buffer Usage</text>
    <text x="12" y="204" fill="#a78bfa" font-family="monospace" font-weight="700" font-size="20">28.4 MB</text>
  </g>

  <!-- Main Chart Area -->
  <g transform="translate(210, 85)">
    <rect x="0" y="0" width="340" height="220" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.06)" />
    <text x="15" y="25" fill="#f1f5f9" font-family="sans-serif" font-weight="600" font-size="12">Throughput Distribution (LTTB Decimated)</text>
    <text x="15" y="42" fill="#64748b" font-family="monospace" font-size="10">Sampling Interval: 10ms (Zero-drop pipeline)</text>

    <!-- Grid lines -->
    <line x1="20" y1="70" x2="320" y2="70" stroke="rgba(255,255,255,0.05)" />
    <line x1="20" y1="110" x2="320" y2="110" stroke="rgba(255,255,255,0.05)" />
    <line x1="20" y1="150" x2="320" y2="150" stroke="rgba(255,255,255,0.05)" />
    <line x1="20" y1="190" x2="320" y2="190" stroke="rgba(255,255,255,0.05)" />

    <!-- Area polygon under line -->
    <polygon points="20,170 45,155 70,165 95,120 125,135 155,95 185,110 215,80 245,100 275,75 305,85 320,80 320,190 20,190" fill="url(#chartGrad)" />

    <!-- Wave line -->
    <polyline points="20,170 45,155 70,165 95,120 125,135 155,95 185,110 215,80 245,100 275,75 305,85 320,80" fill="none" stroke="url(#pulseLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Data Points -->
    <circle cx="155" cy="95" r="4" fill="#38bdf8" />
    <circle cx="215" cy="80" r="5" fill="#10b981" />
    <circle cx="275" cy="75" r="4" fill="#38bdf8" />
  </g>
</svg>

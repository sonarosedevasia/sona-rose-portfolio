<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="dfuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131E" />
      <stop offset="100%" stop-color="#141E2D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="0%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#dfuBg)" rx="12" />

  <!-- Blueprint Neural Matrix Grid -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Main Application Container -->
  <rect x="28" y="22" width="544" height="316" rx="10" fill="#0F172A" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.5" />

  <!-- Top Window Header -->
  <rect x="28" y="22" width="544" height="38" rx="10" fill="#080E1A" />
  <circle cx="50" cy="41" r="5" fill="#EF4444" />
  <circle cx="66" cy="41" r="5" fill="#F59E0B" />
  <circle cx="82" cy="41" r="5" fill="#10B981" />
  <text x="106" y="45" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600">🔬 DFU Classification • Multi-Model CNN Feature Fusion</text>
  <rect x="424" y="31" width="136" height="20" rx="4" fill="rgba(6, 182, 212, 0.2)" />
  <text x="435" y="45" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">TensorFlow • Keras • CNN</text>

  <!-- Section 1: Pretrained Feature Extractors (Left) -->
  <g transform="translate(44, 72)">
    <rect x="0" y="0" width="160" height="248" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.06)" />
    <text x="12" y="22" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="700">Multi-Scale Backbones</text>
    <text x="12" y="36" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Clinical Input [224x224x3]</text>

    <!-- Model 1: DenseNet201 -->
    <rect x="12" y="46" width="136" height="56" rx="6" fill="#0F172A" stroke="rgba(14, 165, 233, 0.35)" />
    <text x="22" y="65" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">DenseNet201</text>
    <text x="22" y="78" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Dense visual connectivity</text>
    <text x="22" y="92" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="8.5">Features: 1920-dim</text>

    <!-- Model 2: VGG19 -->
    <rect x="12" y="110" width="136" height="56" rx="6" fill="#0F172A" stroke="rgba(139, 92, 246, 0.35)" />
    <text x="22" y="129" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">VGG19</text>
    <text x="22" y="142" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Deep spatial textures</text>
    <text x="22" y="156" fill="#7C3AED" font-family="'JetBrains Mono', monospace" font-size="8.5">Features: 512-dim</text>

    <!-- Model 3: NASNetMobile -->
    <rect x="12" y="174" width="136" height="56" rx="6" fill="#0F172A" stroke="rgba(16, 185, 129, 0.35)" />
    <text x="22" y="193" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">NASNetMobile</text>
    <text x="22" y="206" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Efficient neural search</text>
    <text x="22" y="220" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="8.5">Features: 1056-dim</text>
  </g>

  <!-- Connective Data Flow Paths -->
  <g stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6">
    <line x1="204" y1="145" x2="228" y2="175" />
    <line x1="204" y1="209" x2="228" y2="195" />
    <line x1="204" y1="273" x2="228" y2="215" />
  </g>

  <!-- Section 2: Feature Fusion & Classification Head (Center) -->
  <g transform="translate(228, 72)">
    <rect x="0" y="0" width="148" height="248" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.06)" />
    <text x="12" y="22" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="700">Feature Fusion Head</text>
    <text x="12" y="36" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Complementary Ensemble</text>

    <!-- Fusion Block -->
    <rect x="12" y="48" width="124" height="32" rx="4" fill="url(#cyanGrad)" />
    <text x="20" y="68" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Feature Fusion</text>

    <!-- Arrow -->
    <text x="68" y="93" fill="#38BDF8" font-size="11" text-anchor="middle">↓</text>

    <!-- Dropout & BatchNorm -->
    <rect x="12" y="98" width="124" height="24" rx="4" fill="#0F172A" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="114" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5">Dropout + BatchNorm</text>

    <!-- Arrow -->
    <text x="68" y="133" fill="#38BDF8" font-size="11" text-anchor="middle">↓</text>

    <!-- Dense 128 ReLU -->
    <rect x="12" y="138" width="124" height="28" rx="4" fill="url(#purpleGrad)" />
    <text x="18" y="156" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Dense Layer (128, ReLU)</text>

    <!-- Arrow -->
    <text x="68" y="177" fill="#38BDF8" font-size="11" text-anchor="middle">↓</text>

    <!-- Output Softmax -->
    <rect x="12" y="182" width="124" height="32" rx="4" fill="url(#emeraldGrad)" />
    <text x="16" y="202" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Softmax (2 Classes)</text>
    <text x="16" y="228" fill="#6EE7B7" font-family="sans-serif" font-size="8">Healthy ↔ Diabetic Ulcer</text>
  </g>

  <!-- Connective Arrow to Metrics -->
  <g stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7">
    <line x1="376" y1="196" x2="400" y2="196" />
  </g>

  <!-- Section 3: Clinical Prediction & Performance Metrics (Right) -->
  <g transform="translate(400, 72)">
    <rect x="0" y="0" width="156" height="248" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.06)" />
    <text x="12" y="22" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="700">Diagnostic Metrics</text>
    <text x="12" y="36" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Validation &amp; Test Results</text>

    <!-- Prediction Outcome Indicator -->
    <rect x="12" y="46" width="132" height="42" rx="6" fill="#0F172A" stroke="rgba(239, 68, 68, 0.4)" />
    <text x="20" y="63" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">Ulcer Detected</text>
    <text x="20" y="78" fill="#CBD5E1" font-family="sans-serif" font-size="8.5">Confidence: 96.4%</text>

    <!-- Metric Grid -->
    <g transform="translate(12, 98)" font-family="'JetBrains Mono', monospace" font-size="9">
      <!-- Accuracy -->
      <rect x="0" y="0" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="8" y="14" fill="#94A3B8">Accuracy</text>
      <text x="8" y="27" fill="#38BDF8" font-weight="700">96.8%</text>

      <!-- F1 Score -->
      <rect x="70" y="0" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="78" y="14" fill="#94A3B8">F1-Score</text>
      <text x="78" y="27" fill="#34D399" font-weight="700">96.5%</text>

      <!-- Sensitivity -->
      <rect x="0" y="38" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="8" y="52" fill="#94A3B8">Recall/Sens</text>
      <text x="8" y="65" fill="#FBBF24" font-weight="700">97.2%</text>

      <!-- Specificity -->
      <rect x="70" y="38" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="78" y="52" fill="#94A3B8">Specificity</text>
      <text x="78" y="65" fill="#A78BFA" font-weight="700">95.9%</text>

      <!-- ROC-AUC -->
      <rect x="0" y="76" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="8" y="90" fill="#94A3B8">ROC-AUC</text>
      <text x="8" y="103" fill="#38BDF8" font-weight="700">0.984</text>

      <!-- MCC -->
      <rect x="70" y="76" width="62" height="32" rx="4" fill="#0F172A" />
      <text x="78" y="90" fill="#94A3B8">MCC</text>
      <text x="78" y="103" fill="#34D399" font-weight="700">0.932</text>
    </g>
  </g>
</svg>

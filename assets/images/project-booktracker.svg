<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141713" />
      <stop offset="100%" stop-color="#1E231C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B89968" />
      <stop offset="100%" stop-color="#8F7246" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52624E" />
      <stop offset="100%" stop-color="#3A4737" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" fill="url(#bookBg)" rx="12" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Main Application Window -->
  <rect x="30" y="24" width="540" height="312" rx="10" fill="#181D17" stroke="rgba(184, 153, 104, 0.28)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="30" y="24" width="540" height="38" rx="10" fill="#121511" />
  <circle cx="52" cy="43" r="5" fill="#EF4444" />
  <circle cx="68" cy="43" r="5" fill="#F59E0B" />
  <circle cx="84" cy="43" r="5" fill="#10B981" />
  <text x="108" y="47" fill="#EAE5DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600">📚 Book Tracker — Personal Library &amp; Reading Manager</text>
  <rect x="424" y="33" width="132" height="20" rx="4" fill="rgba(184, 153, 104, 0.2)" />
  <text x="435" y="47" fill="#D4BE98" font-family="'JetBrains Mono', monospace" font-size="10">HTML • CSS • JS • LocalStorage</text>

  <!-- Left Column: Add Book & Live Reading Stats -->
  <g transform="translate(48, 74)">
    <!-- Add Book Card -->
    <rect x="0" y="0" width="180" height="136" rx="8" fill="#1E241D" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="22" fill="#F5F3EF" font-family="sans-serif" font-size="11.5" font-weight="700">➕ Add New Book</text>
    
    <!-- Title Input -->
    <rect x="14" y="32" width="152" height="22" rx="4" fill="#131712" stroke="rgba(255,255,255,0.1)" />
    <text x="22" y="47" fill="#A8A29E" font-family="sans-serif" font-size="9.5">Title: Atomic Habits</text>

    <!-- Author Input -->
    <rect x="14" y="60" width="152" height="22" rx="4" fill="#131712" stroke="rgba(255,255,255,0.1)" />
    <text x="22" y="75" fill="#A8A29E" font-family="sans-serif" font-size="9.5">Author: James Clear</text>

    <!-- Status Dropdown & Add Button -->
    <rect x="14" y="88" width="94" height="22" rx="4" fill="#131712" stroke="rgba(255,255,255,0.1)" />
    <text x="22" y="103" fill="#34D399" font-family="sans-serif" font-size="9.5">Status: Reading ▾</text>

    <rect x="114" y="88" width="52" height="22" rx="4" fill="url(#sageGrad)" />
    <text x="127" y="103" fill="#FFFFFF" font-family="sans-serif" font-size="9.5" font-weight="600">+ Add</text>

    <!-- Stats Card -->
    <rect x="0" y="146" width="180" height="96" rx="8" fill="#1E241D" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="168" fill="#F5F3EF" font-family="sans-serif" font-size="11.5" font-weight="700">📊 Reading Statistics</text>
    
    <g transform="translate(14, 182)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#141813" />
      <text x="8" y="15" fill="#A8A29E" font-family="sans-serif" font-size="9">Total:</text>
      <text x="44" y="15" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">14</text>

      <!-- Stat 2 -->
      <rect x="82" y="0" width="70" height="22" rx="4" fill="#141813" />
      <text x="90" y="15" fill="#34D399" font-family="sans-serif" font-size="9">Read:</text>
      <text x="126" y="15" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">8</text>

      <!-- Stat 3 -->
      <rect x="0" y="28" width="70" height="22" rx="4" fill="#141813" />
      <text x="8" y="43" fill="#FBBF24" font-family="sans-serif" font-size="9">In Prog:</text>
      <text x="50" y="43" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">3</text>

      <!-- Stat 4 -->
      <rect x="82" y="28" width="70" height="22" rx="4" fill="#141813" />
      <text x="90" y="43" fill="#93C5FD" font-family="sans-serif" font-size="9">To Read:</text>
      <text x="134" y="43" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">3</text>
    </g>
  </g>

  <!-- Right Column: Search, Filter Tabs & Book Collection (Newest First) -->
  <g transform="translate(242, 74)">
    <!-- Search Bar -->
    <rect x="0" y="0" width="312" height="28" rx="6" fill="#141813" stroke="rgba(255,255,255,0.12)" />
    <text x="12" y="18" fill="#A8A29E" font-family="sans-serif" font-size="10.5">🔍 Search books by title or author...</text>

    <!-- Reading Status Filter Tabs -->
    <g transform="translate(0, 36)" font-family="sans-serif" font-size="9" font-weight="600">
      <rect x="0" y="0" width="46" height="18" rx="9" fill="url(#sageGrad)" />
      <text x="14" y="12" fill="#FFFFFF">All (14)</text>

      <rect x="52" y="0" width="62" height="18" rx="9" fill="#1A2019" stroke="rgba(255,255,255,0.08)" />
      <text x="61" y="12" fill="#93C5FD">To Read (3)</text>

      <rect x="120" y="0" width="66" height="18" rx="9" fill="#1A2019" stroke="rgba(255,255,255,0.08)" />
      <text x="129" y="12" fill="#FBBF24">Reading (3)</text>

      <rect x="192" y="0" width="66" height="18" rx="9" fill="#1A2019" stroke="rgba(255,255,255,0.08)" />
      <text x="201" y="12" fill="#34D399">Finished (8)</text>
    </g>

    <!-- Book 1 (Newest First) -->
    <rect x="0" y="64" width="312" height="52" rx="6" fill="#1D231C" stroke="rgba(52, 211, 153, 0.25)" />
    <text x="14" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="700">Atomic Habits</text>
    <text x="14" y="103" fill="#A8A29E" font-family="sans-serif" font-size="9.5">by James Clear • Added just now</text>
    <rect x="206" y="78" width="64" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" />
    <text x="217" y="93" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="600">Reading ▾</text>
    <text x="286" y="93" fill="#EF4444" font-family="sans-serif" font-size="12" cursor="pointer">🗑</text>

    <!-- Book 2 -->
    <rect x="0" y="124" width="312" height="52" rx="6" fill="#1A2019" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="700">Clean Code: A Handbook of Agile Software</text>
    <text x="14" y="163" fill="#A8A29E" font-family="sans-serif" font-size="9.5">by Robert C. Martin</text>
    <rect x="206" y="138" width="64" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" />
    <text x="215" y="153" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="600">Finished ▾</text>
    <text x="286" y="153" fill="#EF4444" font-family="sans-serif" font-size="12" cursor="pointer">🗑</text>

    <!-- Book 3 -->
    <rect x="0" y="184" width="312" height="52" rx="6" fill="#1A2019" stroke="rgba(255,255,255,0.06)" />
    <text x="14" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="700">Designing Data-Intensive Applications</text>
    <text x="14" y="223" fill="#A8A29E" font-family="sans-serif" font-size="9.5">by Martin Kleppmann</text>
    <rect x="206" y="198" width="64" height="22" rx="4" fill="rgba(147, 197, 253, 0.2)" stroke="rgba(147, 197, 253, 0.4)" />
    <text x="214" y="213" fill="#93C5FD" font-family="sans-serif" font-size="9" font-weight="600">To Read ▾</text>
    <text x="286" y="213" fill="#EF4444" font-family="sans-serif" font-size="12" cursor="pointer">🗑</text>
  </g>

  <!-- Bottom Sync Status -->
  <g transform="translate(48, 318)" font-family="'JetBrains Mono', monospace" font-size="9.5">
    <circle cx="4" cy="-3" r="3.5" fill="#10B981" />
    <text x="14" y="0" fill="#34D399">Persistent storage via window.localStorage active</text>
    <text x="350" y="0" fill="#A8A29E">Live on GitHub Pages • Fully Responsive</text>
  </g>
</svg>

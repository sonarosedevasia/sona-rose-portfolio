<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <rect width="600" height="360" fill="#0b0e14" rx="12" />
  <rect x="30" y="25" width="540" height="310" rx="10" fill="#111722" stroke="rgba(255,255,255,0.08)" />
  <rect x="30" y="25" width="540" height="36" rx="10" fill="#0c111a" />
  <circle cx="50" cy="43" r="4.5" fill="#ef4444" />
  <circle cx="65" cy="43" r="4.5" fill="#f59e0b" />
  <circle cx="80" cy="43" r="4.5" fill="#10b981" />
  <text x="105" y="47" fill="#818cf8" font-family="monospace" font-size="11">QuantEngine :: OrderBook Matching Simulator (C++20)</text>

  <!-- Candlesticks and order depth -->
  <g transform="translate(60, 90)">
    <!-- Bullish candle -->
    <line x1="40" y1="20" x2="40" y2="150" stroke="#10b981" stroke-width="1.5" />
    <rect x="30" y="50" width="20" height="70" fill="#10b981" rx="2" />

    <!-- Bearish candle -->
    <line x1="90" y1="35" x2="90" y2="170" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="80" y="65" width="20" height="85" fill="#f43f5e" rx="2" />

    <!-- Bullish candle -->
    <line x1="140" y1="15" x2="140" y2="130" stroke="#10b981" stroke-width="1.5" />
    <rect x="130" y="40" width="20" height="60" fill="#10b981" rx="2" />

    <!-- Bullish candle -->
    <line x1="190" y1="10" x2="190" y2="110" stroke="#10b981" stroke-width="1.5" />
    <rect x="180" y="25" width="20" height="55" fill="#10b981" rx="2" />

    <!-- Right Side Stats -->
    <rect x="250" y="10" width="220" height="180" rx="8" fill="#090d15" stroke="rgba(255,255,255,0.05)" />
    <text x="270" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Matching Core Throughput</text>
    <text x="270" y="66" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="20">2.14M ticks/s</text>

    <text x="270" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11">Sharpe Ratio</text>
    <text x="270" y="125" fill="#34d399" font-family="monospace" font-weight="700" font-size="18">2.84 (Annualized)</text>

    <text x="270" y="155" fill="#94a3b8" font-family="sans-serif" font-size="11">Max Drawdown: <tspan fill="#f87171"> -4.2%</tspan></text>
  </g>
</svg>
